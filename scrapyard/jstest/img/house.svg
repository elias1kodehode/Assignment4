<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 800"
     width="1200" height="800"
     role="img" aria-labelledby="title desc">
  <title id="title">Interactive house scene</title>
  <desc id="desc">A stylized front-facing house with a clickable front door and four visible room areas designed for an interactive website.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc6e8"/>
      <stop offset="1" stop-color="#dceef4"/>
    </linearGradient>

    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a68"/>
      <stop offset="1" stop-color="#9b6c43"/>
    </linearGradient>

    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#594333"/>
      <stop offset="1" stop-color="#34251d"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".28"/>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".22"/>
    </filter>

    <pattern id="wood" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#a97447"/>
      <path d="M0 6 C8 2 18 10 28 5 M0 20 C10 15 19 24 28 18"
            fill="none" stroke="#7c4f31" stroke-width="2" opacity=".45"/>
    </pattern>

    <!-- Room shapes are intentionally separate SVG groups.
         They can be used as targets for your JS later. -->
  </defs>

  <!-- OUTSIDE SCENE -->
  <g id="outside-scene">
    <rect id="background" width="1200" height="800" fill="url(#sky)"/>

    <!-- Moon / sun -->
    <circle cx="980" cy="130" r="58" fill="#f5df9b" opacity=".9"/>

    <!-- Ground -->
    <path d="M0 610 Q250 570 480 615 T900 600 T1200 610 V800 H0 Z"
          fill="#5e784b"/>
    <path d="M0 680 Q300 640 600 685 T1200 675 V800 H0 Z"
          fill="#49623c"/>

    <!-- House shadow -->
    <ellipse cx="600" cy="680" rx="480" ry="55" fill="#24321f" opacity=".28"/>

    <!-- Main house -->
    <g id="house" filter="url(#shadow)">
      <!-- Main wall -->
      <rect x="210" y="300" width="780" height="350"
            rx="6" fill="url(#wall)" stroke="#4a3324" stroke-width="10"/>

      <!-- Timber framing -->
      <g id="timber-frame" fill="#4b3324">
        <rect x="200" y="290" width="800" height="28" rx="4"/>
        <rect x="200" y="625" width="800" height="28" rx="4"/>
        <rect x="230" y="300" width="24" height="350"/>
        <rect x="946" y="300" width="24" height="350"/>
        <rect x="570" y="300" width="24" height="350"/>
      </g>

      <!-- Roof -->
      <path id="roof"
            d="M125 315 L600 65 L1075 315 L1030 360 L600 135 L170 360 Z"
            fill="url(#roof)" stroke="#38271d" stroke-width="12"
            stroke-linejoin="round"/>

      <!-- Chimney -->
      <g id="chimney">
        <rect x="825" y="125" width="82" height="155"
              fill="#704f3d" stroke="#3e2b22" stroke-width="8"/>
        <path d="M810 125 H922 V105 Q922 94 911 94 H821 Q810 94 810 105Z"
              fill="#4b3529"/>
      </g>

      <!-- Left window / living room target -->
      <g id="living-room" data-room="living-room">
        <rect x="275" y="375" width="205" height="155"
              rx="8" fill="#7fc1d2" stroke="#39291f" stroke-width="12"/>
        <path d="M377.5 375 V530 M275 452.5 H480"
              stroke="#39291f" stroke-width="10"/>
        <path d="M290 392 H365 M392 392 H465"
              stroke="#dff5f5" stroke-width="10" opacity=".7"/>
      </g>

      <!-- Right window / kitchen target -->
      <g id="kitchen" data-room="kitchen">
        <rect x="720" y="375" width="205" height="155"
              rx="8" fill="#7fc1d2" stroke="#39291f" stroke-width="12"/>
        <path d="M822.5 375 V530 M720 452.5 H925"
              stroke="#39291f" stroke-width="10"/>
        <path d="M735 392 H810 M837 392 H910"
              stroke="#dff5f5" stroke-width="10" opacity=".7"/>
      </g>

      <!-- Central door / main entry target -->
      <g id="front-door" data-action="enter" filter="url(#softShadow)">
        <rect x="505" y="395" width="130" height="255"
              rx="7" fill="url(#wood)" stroke="#3a281d" stroke-width="12"/>
        <path d="M520 415 H620 V635 H520 Z"
              fill="none" stroke="#6d432a" stroke-width="6"/>
        <circle cx="603" cy="525" r="9" fill="#d5b35c" stroke="#4a3424" stroke-width="4"/>
        <path d="M545 430 H595 M545 470 H595 M545 510 H595"
              stroke="#c38a50" stroke-width="4" opacity=".65"/>
      </g>

      <!-- Small foundation -->
      <path d="M190 650 H1010 V680 H190 Z"
            fill="#6f6a5c" stroke="#403c34" stroke-width="8"/>
    </g>

    <!-- Front path -->
    <path d="M570 680 C560 730 520 765 480 800 H720 C680 765 640 730 630 680 Z"
          fill="#9c8b72" opacity=".85"/>

    <!-- Decorative bushes -->
    <g id="foliage" fill="#35533a">
      <circle cx="140" cy="570" r="55"/>
      <circle cx="185" cy="550" r="70"/>
      <circle cx="1050" cy="575" r="65"/>
      <circle cx="1090" cy="550" r="50"/>
    </g>
  </g>

  <!-- INTERIOR SCENE / FLOOR PLAN.
       This is included in the same SVG so you can transition between
       outside-scene and inside-scene without replacing the asset. -->
  <g id="inside-scene" visibility="hidden">
    <rect width="1200" height="800" fill="#302820"/>

    <!-- House interior shell -->
    <rect x="110" y="80" width="980" height="640"
          rx="10" fill="#b98b5e" stroke="#1f1813" stroke-width="14"/>

    <!-- Rooms -->
    <g id="inside-rooms">
      <!-- Living room -->
      <g id="room-living-room" data-room="living-room">
        <rect x="135" y="105" width="440" height="280"
              fill="#9d704b" stroke="#4b3424" stroke-width="10"/>
        <text x="355" y="250" text-anchor="middle"
              font-family="Georgia, serif" font-size="34"
              fill="#ead9bc">LIVING ROOM</text>
      </g>

      <!-- Kitchen -->
      <g id="room-kitchen" data-room="kitchen">
        <rect x="590" y="105" width="585" height="280"
              fill="#a67a52" stroke="#4b3424" stroke-width="10"/>
        <text x="882" y="250" text-anchor="middle"
              font-family="Georgia, serif" font-size="34"
              fill="#ead9bc">KITCHEN</text>
      </g>

      <!-- Bedroom -->
      <g id="room-bedroom" data-room="bedroom">
        <rect x="135" y="410" width="440" height="285"
              fill="#8f6748" stroke="#4b3424" stroke-width="10"/>
        <text x="355" y="555" text-anchor="middle"
              font-family="Georgia, serif" font-size="34"
              fill="#ead9bc">BEDROOM</text>
      </g>

      <!-- Bathroom -->
      <g id="room-bathroom" data-room="bathroom">
        <rect x="590" y="410" width="585" height="285"
              fill="#7f7669" stroke="#4b3424" stroke-width="10"/>
        <text x="882" y="555" text-anchor="middle"
              font-family="Georgia, serif" font-size="34"
              fill="#ead9bc">BATHROOM</text>
      </g>
    </g>

    <!-- Simple furniture silhouettes -->
    <g id="interior-furniture" fill="#513725" opacity=".75">
      <rect x="220" y="170" width="150" height="65" rx="12"/>
      <rect x="245" y="145" width="100" height="35" rx="10"/>
      <rect x="690" y="160" width="250" height="35" rx="5"/>
      <rect x="705" y="195" width="35" height="90"/>
      <rect x="890" y="195" width="35" height="90"/>
      <rect x="220" y="485" width="270" height="150" rx="10"/>
      <rect x="735" y="480" width="180" height="45" rx="8"/>
      <circle cx="1000" cy="565" r="65"/>
    </g>
  </g>
</svg>
